[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
addopts =
    --tb=short
    -q
    --cov=cyberwall
    --cov-report=term-missing
    --cov-fail-under=70
    tests/unit/test_cyberwall_v2.py
    tests/unit/test_coverage_booster.py
    tests/unit/test_new_features.py
    tests/unit/test_coverage_booster2.py
    tests/unit/test_missing_coverage.py
    tests/unit/test_ai_and_identity.py
    tests/unit/test_coverage_booster3.py
    tests/unit/test_coverage_booster4.py
    tests/unit/test_coverage_booster5.py
    tests/unit/test_coverage_booster6.py
