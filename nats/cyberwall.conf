# Sorabbyngo Cyberwall — NATS config extension
# Include this in your main sorabbyngo.conf

# Cyberwall subjects are scoped under sorabbyngo.cyberwall.*
# JetStream stream for persistent threat log

jetstream {
  store_dir: /var/lib/sorabbyngo/nats
}

accounts {
  sorabbyngo {
    jetstream: enabled
    users: [
      { user: cyberwall, password: cyberwall_local }
    ]
    exports: [
      { stream: "sorabbyngo.cyberwall.>" }
    ]
  }
}
